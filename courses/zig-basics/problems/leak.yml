id: leak
title: "Finding a Leak"
type: code
language: zig
body: |
  Memory that is allocated and never freed is a leak. The DebugAllocator
  keeps track of every allocation, and when it is deinitialised, by the
  defer _ = gpa.deinit(); at the top of main, it reports anything that is
  still allocated.

  Run the program below and look at the end of the output.
question: |
  Fix the leak, so that the program prints only its own two lines.
starter_code: |
  const std = @import("std");

  pub fn main() !void {
      var gpa = std.heap.DebugAllocator(.{}){};
      defer _ = gpa.deinit();
      const allocator = gpa.allocator();

      const name = try allocator.alloc(u8, 5);
      @memcpy(name, "Ziggy");
      std.debug.print("hello, {s}\n", .{name});
      std.debug.print("{d} bytes\n", .{name.len});
  }
expected_output: |
  hello, Ziggy
  5 bytes
explanation: |
  defer allocator.free(name); right after the alloc. The report said
  "memory address ... leaked". Running with the DebugAllocator while you
  develop catches leaks before your users do. @memcpy copies bytes into a
  slice of the same length.
