id: stack-pop
title: "pop"
type: code
language: zig
body: |
  pop takes the top item off and returns it. The stack may be empty, so it
  returns an optional, null when there is nothing to pop: the book's
  version returns nothing, which makes the stack much less useful.
question: Write pop and peek, which returns the top item without removing it, both returning null when the stack is empty.
starter_code: |
  const std = @import("std");

  const Stack = struct {
      items: []u32,
      length: usize,
      allocator: std.mem.Allocator,

      pub fn init(allocator: std.mem.Allocator, capacity: usize) !Stack {
          return .{
              .items = try allocator.alloc(u32, capacity),
              .length = 0,
              .allocator = allocator,
          };
      }

      pub fn deinit(self: *Stack) void {
          self.allocator.free(self.items);
      }

      pub fn push(self: *Stack, value: u32) !void {
          if (self.length == self.items.len) {
              const bigger = try self.allocator.alloc(u32, self.items.len * 2);
              @memcpy(bigger[0..self.length], self.items);
              self.allocator.free(self.items);
              self.items = bigger;
          }
          self.items[self.length] = value;
          self.length += 1;
      }

      pub fn pop(self: *Stack) ?u32 {
          _ = self;
          return null;
      }

      pub fn peek(self: Stack) ?u32 {
          _ = self;
          return null;
      }
  };

  pub fn main() !void {
      var gpa = std.heap.DebugAllocator(.{}){};
      defer _ = gpa.deinit();
      const allocator = gpa.allocator();

      var stack = try Stack.init(allocator, 4);
      defer stack.deinit();
      try stack.push(1);
      try stack.push(2);
      try stack.push(3);

      std.debug.print("peek {?d}\n", .{stack.peek()});
      while (stack.pop()) |value| std.debug.print("popped {d}\n", .{value});
      std.debug.print("peek {?d}\n", .{stack.peek()});
  }
expected_output: |
  peek 3
  popped 3
  popped 2
  popped 1
  peek null
explanation: |
  pop: if empty, null; otherwise take one off the length and return the
  item there. The item stays in memory, but is no longer part of the
  stack, and the next push overwrites it. The while with a capture pops
  until pop returns null.
