id: if-else
title: "if and else"
type: code
language: zig
body: |
  if takes a bool in parentheses; Zig never treats a number as true or false.
  else if adds more cases, tried in order:

      if (x > 10) {
          ...
      } else if (x > 0) {
          ...
      } else {
          ...
      }

  if is also an expression, so it can give a value:

      const parity = if (n % 2 == 0) "even" else "odd";
question: |
  Write describe, so that it returns "negative", "zero", "small" (1 to 9) or
  "large" (10 or more).
starter_code: |
  const std = @import("std");

  fn describe(n: i32) []const u8 {
      _ = n;
      return "?";
  }

  pub fn main() void {
      for ([_]i32{ -5, 0, 7, 42 }) |n| {
          std.debug.print("{d} is {s}\n", .{ n, describe(n) });
      }
  }
expected_output: |
  -5 is negative
  0 is zero
  7 is small
  42 is large
explanation: |
  Functions are fn name(parameter: Type) ReturnType. As an expression, it
  could also be return if (n < 0) "negative" else if (n == 0) "zero" else ...
