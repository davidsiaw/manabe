id: bracket-matcher
title: "Putting It Together: Matching Brackets"
type: code
language: zig
body: |
  A stack is the natural way to check that brackets match: (), [] and {}.
  Go through the text; push each opening bracket; for each closing one,
  pop, and check that it closes the bracket popped. At the end, the stack
  must be empty. Anything else in the text is ignored.

  The generic Stack from the last problem is below, holding u8s.
question: Write balanced.
starter_code: |
  const std = @import("std");

  fn Stack(comptime T: type) type {
      return struct {
          items: []T,
          length: usize,
          allocator: std.mem.Allocator,

          const Self = @This();

          pub fn init(allocator: std.mem.Allocator, capacity: usize) !Self {
              return .{ .items = try allocator.alloc(T, capacity), .length = 0, .allocator = allocator };
          }

          pub fn deinit(self: *Self) void {
              self.allocator.free(self.items);
          }

          pub fn push(self: *Self, value: T) !void {
              if (self.length == self.items.len) {
                  const bigger = try self.allocator.alloc(T, self.items.len * 2);
                  @memcpy(bigger[0..self.length], self.items);
                  self.allocator.free(self.items);
                  self.items = bigger;
              }
              self.items[self.length] = value;
              self.length += 1;
          }

          pub fn pop(self: *Self) ?T {
              if (self.length == 0) return null;
              self.length -= 1;
              return self.items[self.length];
          }
      };
  }

  fn balanced(allocator: std.mem.Allocator, text: []const u8) !bool {
      _ = allocator;
      _ = text;
      return false;
  }

  pub fn main() !void {
      var gpa = std.heap.DebugAllocator(.{}){};
      defer _ = gpa.deinit();
      const allocator = gpa.allocator();

      for ([_][]const u8{ "(a[b]{c})", "(]", "((x)", "f(a, b[0]) { return; }", "}{" }) |text| {
          std.debug.print("{s}: {any}\n", .{ text, try balanced(allocator, text) });
      }
  }
expected_output: |
  (a[b]{c}): true
  (]: false
  ((x): false
  f(a, b[0]) { return; }: true
  }{: false
explanation: |
  A switch on each character: push the opening ones; for a closing one,
  pop with orelse return false (nothing to close), and compare with the
  bracket it should close. The defer frees the stack on every return,
  early or not. "}{" fails at once: the first } has nothing to pop.
