id: slices
title: "Slices"
type: code
language: zig
body: |
  A slice is a view of some of an array's elements: a pointer to the first one
  and a length. It is made with a range, start included, end excluded:

      const ns = [_]u8{ 48, 24, 12, 6 };
      const sl = ns[1..3];      // 24 and 12
      const rest = ns[1..];     // 24, 12 and 6

  Like an array it has .len, can be indexed and works in a for loop. {any}
  prints all of it.
question: |
  Print only the middle three of the five readings, and how many that is,
  as below, using a slice.
starter_code: |
  const std = @import("std");

  pub fn main() void {
      const readings = [_]i32{ 10, 20, 30, 40, 50 };
      std.debug.print("{any} ({d})\n", .{ readings, readings.len });
  }
expected_output: |
  { 20, 30, 40 } (3)
explanation: |
  readings[1..4] starts at index 1 and stops before index 4. Nothing is
  copied: the slice points into readings.
