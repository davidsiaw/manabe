id: array-operators
title: "Joining Arrays with ++"
type: multiple_choice
body: |
  ++ joins two arrays into a new one:

      const a = [_]u8{ 1, 2, 3 };
      const b = [_]u8{ 4, 5 };
      const c = a ++ b;     // 1, 2, 3, 4, 5

  Strings are arrays of bytes, so it joins strings too:

      const greeting = "Hello, " ++ "Zig";

  The compiler does the joining, so both lengths must be known while
  compiling: literals and arrays, yes; a slice whose length is only known when
  the program runs, no. Joining text at run time needs memory set aside for
  the result, which is what allocators, in the last chapter, are for.
question: |
  In which of these does ++ not compile?
choices:
  - id: a
    text: "\"Hello, \" ++ name, where name is a []const u8 parameter of a function"
    correct: true
  - id: b
    text: "\"Hello, \" ++ \"Zig\""
  - id: c
    text: "a ++ b, with a and b the arrays above"
  - id: d
    text: "a ++ a"
explanation: |
  A parameter's length is only known when the function runs, and the
  compiler says "unable to resolve comptime value". The others are all
  known while compiling.
