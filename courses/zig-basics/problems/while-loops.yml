id: while-loops
title: "while Loops"
type: code
language: zig
body: |
  while repeats while its condition is true. The part after the colon, the
  continue expression, runs at the end of every time round:

      var i: usize = 1;
      while (i < 5) : (i += 1) {
          ...
      }

  break leaves the loop; continue skips to the next time round, and still
  runs the continue expression.
question: |
  Print every power of 2 that is less than 1000, starting from 1, one per
  line.
starter_code: |
  const std = @import("std");

  pub fn main() void {
      var power: u32 = 1;
      _ = &power;
  }
expected_output: |
  1
  2
  4
  8
  16
  32
  64
  128
  256
  512
explanation: |
  while (power < 1000) : (power *= 2). The starter's _ = &power; only kept
  the compiler quiet about a var that is never changed; remove it.
