id: c-interop
title: "Zig and C"
type: multiple_choice
body: |
  A huge amount of software is written in C, and Zig can use it directly.
  Zig functions and types can follow C's ABI, the rules for how functions
  are called and how data is laid out in memory, so a C function is called
  like any other, with no wrapper code in between.

  Zig also comes with a C compiler, so a Zig project can compile the C
  libraries it uses along with its own code, for any target.

  Calling C takes two things:

  - the declarations of the C functions and types, which come from C
    header files, or are written by hand in Zig
  - linking the compiled C code, a library, or the C files themselves,
    into the program
question: Why does calling a C function from Zig need no wrapper code?
choices:
  - id: a
    text: "Zig can follow C's ABI, so it calls C functions the way C itself does"
    correct: true
  - id: b
    text: "Zig translates the C function into Zig while running"
  - id: c
    text: "C functions are run in a separate process"
  - id: d
    text: "It does need wrappers, generated by the compiler"
explanation: |
  The C ABI is the common language of native code: most languages can
  call C, and be called from it, which is why C libraries are usable from
  almost anywhere.
