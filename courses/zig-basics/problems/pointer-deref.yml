id: pointer-deref
title: "Pointers"
type: code
language: zig
body: |
  A pointer is a value that holds a memory address: where some other value
  is stored. & in front of a name gives its address, and .* after a
  pointer gives the value it points to, dereferencing it:

      const number: u8 = 5;
      const pointer = &number;      // a pointer to number
      const value = pointer.*;      // 5

  A pointer is a way to reach a value without copying it, which matters
  when the value is large, or when a function has to change it.

  Run the program: the compiler refuses to multiply a pointer.
question: Fix the program so that it doubles the value the pointer points to.
starter_code: |
  const std = @import("std");

  pub fn main() void {
      const number: u8 = 21;
      const pointer = &number;

      const doubled = 2 * pointer;
      std.debug.print("{d}\n", .{doubled});
  }
expected_output: |
  42
explanation: |
  2 * pointer.*. The error said "incompatible types: 'comptime_int' and
  '*const u8'": pointer is the address, not the number. The type also
  says that it points to a constant u8, which the next problem is about.
