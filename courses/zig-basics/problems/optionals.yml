id: optionals
title: "Optionals"
type: code
language: zig
body: |
  When a value may really be missing, its type says so with a ? in front:
  ?u32 is either a u32, or null. This is an optional.

      var num: ?i32 = 5;
      num = null;              // fine

  {?d} prints an optional number, as the number or as null.

  findFirstEven returns the first even number of a list, but there might
  not be one. Run the program: there is no way to return "no number" from
  a function that returns a u32.
question: Make findFirstEven return an optional, and null when there is no even number.
starter_code: |
  const std = @import("std");

  fn findFirstEven(numbers: []const u32) u32 {
      for (numbers) |n| {
          if (n % 2 == 0) return n;
      }
      return null;
  }

  pub fn main() void {
      std.debug.print("{?d}\n", .{findFirstEven(&.{ 3, 7, 8, 5, 10 })});
      std.debug.print("{?d}\n", .{findFirstEven(&.{ 1, 3, 5 })});
  }
expected_output: |
  8
  null
explanation: |
  The return type ?u32 is the whole fix: return n turns the u32 into an
  optional by itself. &.{ 3, 7, 8, 5, 10 } is a pointer to an anonymous
  array, which turns into a slice.
