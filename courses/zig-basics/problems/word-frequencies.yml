id: word-frequencies
title: "Counting with getOrPut"
type: code
language: zig
body: |
  Counting things is the classic use of a hash map. getOrPut looks a key
  up, and inserts it if it is missing, in one go. It returns the entry,
  with found_existing saying which happened:

      const entry = try counts.getOrPut(allocator, word);
      if (!entry.found_existing) entry.value_ptr.* = 0;
      entry.value_ptr.* += 1;

  When a key is new, its value is undefined until set.

  The program uses a StringArrayHashMapUnmanaged, so that the words come
  out in the order they first appeared. Being unmanaged, like ArrayList,
  it takes the allocator in each call.
question: Count the words, so that the program prints each word's count, as below.
starter_code: |
  const std = @import("std");

  pub fn main() !void {
      var gpa = std.heap.DebugAllocator(.{}){};
      defer _ = gpa.deinit();
      const allocator = gpa.allocator();

      const text = "the cat and the hat and the bat";

      var counts: std.StringArrayHashMapUnmanaged(u32) = .empty;
      defer counts.deinit(allocator);

      var words = std.mem.tokenizeScalar(u8, text, ' ');
      while (words.next()) |word| {
          _ = word;
      }

      var it = counts.iterator();
      while (it.next()) |entry| {
          std.debug.print("{s} {d}\n", .{ entry.key_ptr.*, entry.value_ptr.* });
      }
  }
expected_output: |
  the 3
  cat 1
  and 2
  hat 1
  bat 1
explanation: |
  The three lines above, in the loop. The map does not copy the keys: they
  are slices of text, which is fine as text outlives the map. Keys made in
  a buffer that is reused would have to be copied, with allocator.dupe.
