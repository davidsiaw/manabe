id: testing-allocator
title: "Tests Find Leaks"
type: multiple_choice
body: |
  In a test, std.testing.allocator is an allocator that checks for leaks,
  like the DebugAllocator: if a test ends with memory still allocated, the
  test fails, and the report says where it was allocated.

      test "no leaks" {
          const allocator = std.testing.allocator;
          const buffer = try allocator.alloc(u32, 10);
          defer allocator.free(buffer);
      }

  It only exists in tests. In a program, using it does not compile: "not
  testing".
question: A function allocates and forgets to free. What does a test that calls it with std.testing.allocator do?
choices:
  - id: a
    text: "Fails, and reports the leak and where the memory was allocated"
    correct: true
  - id: b
    text: "Passes, as long as its checks pass"
  - id: c
    text: "Crashes the computer"
  - id: d
    text: "Frees the memory itself, and passes"
explanation: |
  So every function that takes an allocator can be checked for leaks just
  by testing it with std.testing.allocator. Passing the allocator in, the
  Zig way, is what makes this possible.
