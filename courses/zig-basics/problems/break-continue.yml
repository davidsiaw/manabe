id: break-continue
title: "break and continue"
type: multiple_choice
body: |
  In a loop:

  - break leaves the loop at once.
  - continue skips the rest of this time round. In a while loop with a
    continue expression, that expression still runs.

  Loops can be labeled, like blocks, so that break :outer leaves an outer
  loop from inside an inner one.
question: |
  What does this print?

      var i: u32 = 0;
      while (i < 6) : (i += 1) {
          if (i == 1) continue;
          if (i == 4) break;
          std.debug.print("{d} ", .{i});
      }
choices:
  - id: a
    text: "0 2 3"
    correct: true
  - id: b
    text: "0 2 3 4"
  - id: c
    text: "0 1 2 3"
  - id: d
    text: "It never stops: continue skips the i += 1"
explanation: |
  At 1 it skips the print, and i += 1 still runs; at 4 it stops before
  printing.
