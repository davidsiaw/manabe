id: loops
title: Loops
type: code
language: ruby
body: |
  Rubyists rarely write a for loop. Instead, numbers and ranges have methods
  that take a block, the code between do and end (or between { and }), and
  run it repeatedly:

    3.times do |i|
      puts i         # 0, then 1, then 2
    end

    (1..3).each { |n| puts n * 10 }    # 10, 20, 30

  The name between the bars is the block's parameter: each time round, it
  holds the next value. 1..3 is a Range, from 1 to 3 inclusive.

  There is also while, which repeats as long as a condition is true.
question: Print the squares of the numbers from 1 to 6, one per line.
expected_output: |
  1
  4
  9
  16
  25
  36
explanation: |
  (1..6).each { |n| puts n * n }, or n ** 2. 1.upto(6) { |n| ... } does the
  same.
