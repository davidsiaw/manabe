id: blocks
title: map and select
type: multiple_choice
body: |
  Many Array methods take a block and build a new Array from what it returns.

  map makes an Array of the block's results:

    [1, 2, 3].map { |x| x * 10 }         # => [10, 20, 30]

  select keeps the elements for which the block is true, and reject those
  for which it is false:

    [1, 2, 3, 4].select { |x| x.even? }  # => [2, 4]

  They can be chained, each one working on the result of the one before.
question: What is [1, 2, 3, 4, 5].select { |x| x.odd? }.map { |x| x * x } ?
choices:
  - id: a
    text: "[1, 4, 9, 16, 25]"
  - id: b
    text: "[1, 9, 25]"
    correct: true
  - id: c
    text: "[4, 16]"
  - id: d
    text: "[true, false, true, false, true]"
explanation: |
  select keeps 1, 3 and 5, then map squares them. Mapping with x.odd? on its
  own would give the Array of true and false.
