id: arithmetic
title: Arithmetic
type: code
language: ruby
body: |
  Ruby does arithmetic with + - * / and % (remainder), and ** for powers.

  Whole numbers are Integers, and dividing two Integers gives an Integer,
  dropping the fraction:

    7 / 2          # => 3

  If either side is a Float (a number with a decimal point), so is the
  result:

    7.0 / 2        # => 3.5
question: |
  Print, one per line: 17 divided by 5 as an Integer, the remainder of 17
  divided by 5, 17 divided by 5 as a Float, and 2 to the power of 10.
starter_code: |
  puts 17 / 5
expected_output: |
  3
  2
  3.4
  1024
explanation: |
  puts 17 / 5, puts 17 % 5, puts 17.0 / 5 and puts 2 ** 10. puts also takes
  several values at once and prints each on its own line:
  puts 17 / 5, 17 % 5, 17.0 / 5, 2 ** 10.
