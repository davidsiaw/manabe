id: hello-world
title: Hello, World
type: code
language: ruby
body: |
  A Ruby program is a list of statements, run from top to bottom. The first
  one most people write prints a line of text:

    puts "Hello, world!"

  puts ("put string") prints what you give it, followed by a new line. Text in
  double quotes is a String.

  Write your program in the editor below. Run shows you what it prints; Check
  answer runs it and checks what it printed.
question: Print Hello, world!
starter_code: |
  # Write your program here.
expected_output: |
  Hello, world!
explanation: |
  puts "Hello, world!" is the whole program. Ruby needs no main function and
  no semicolons.
