id: methods
title: Methods
type: code
language: ruby
body: |
  def defines a method. Its value is the value of the last expression in it,
  so return is only needed to leave early:

    def double(x)
      x * 2
    end

    puts double(21)    # 42

  A method name may end in ? when it answers a yes or no question, as even?
  does.
question: |
  Write a method leap_year?(year). A year is a leap year if it is divisible
  by 4, except that years divisible by 100 are not, except that years
  divisible by 400 are. The program then prints the answer for each year.
starter_code: |
  def leap_year?(year)
    # your code here
  end

  [1900, 2000, 2023, 2024].each do |year|
    puts "#{year}: #{leap_year?(year)}"
  end
expected_output: |
  1900: false
  2000: true
  2023: false
  2024: true
explanation: |
  One expression does it, and its value is the method's value:

    def leap_year?(year)
      (year % 4 == 0 && year % 100 != 0) || year % 400 == 0
    end
