id: hashes
title: Hashes
type: code
language: ruby
body: |
  A Hash maps keys to values. Symbols such as :alice make good keys, and
  have a short way of being written:

    ages = { alice: 31, bob: 27 }
    ages[:alice]       # => 31
    ages[:carol] = 40  # adds a key
    ages[:dave]        # => nil

  each gives the block every key and value, in the order they were added:

    ages.each do |name, age|
      puts "#{name} is #{age}"
    end

  select, map, sort_by and many other Array methods work on a Hash too.
question: |
  Print the name of every student who scored 80 or more, highest score first,
  as the name, a colon, a space and the score: alice: 92 and so on.
starter_code: |
  scores = { bob: 67, alice: 92, carol: 85, dave: 79, erin: 80 }
expected_output: |
  alice: 92
  carol: 85
  erin: 80
explanation: |
  Select first, then sort. sort_by sorts lowest first, so sort by the
  negative score, or call reverse afterwards:

    scores.select { |name, score| score >= 80 }
          .sort_by { |name, score| -score }
          .each { |name, score| puts "#{name}: #{score}" }
