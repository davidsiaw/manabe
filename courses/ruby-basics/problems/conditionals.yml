id: conditionals
title: Conditionals
type: code
language: ruby
body: |
  if runs code only when a condition is true. elsif and else add more cases,
  and end closes it:

    if temperature > 25
      puts "hot"
    elsif temperature > 15
      puts "mild"
    else
      puts "cold"
    end

  Comparisons are == != < > <= and >=. Combine conditions with && (and) and
  || (or).
question: |
  The program goes through the numbers 1 to 15. Fill in the body so that it
  prints Fizz for multiples of 3, Buzz for multiples of 5, FizzBuzz for
  multiples of both, and otherwise the number itself.
starter_code: |
  (1..15).each do |n|
    # print Fizz, Buzz, FizzBuzz or n
  end
expected_output: |
  1
  2
  Fizz
  4
  Buzz
  Fizz
  7
  8
  Fizz
  Buzz
  11
  Fizz
  13
  14
  FizzBuzz
explanation: |
  Check for both first, or a multiple of 15 stops at the Fizz case:

    if n % 15 == 0
      puts "FizzBuzz"
    elsif n % 3 == 0
      puts "Fizz"
    elsif n % 5 == 0
      puts "Buzz"
    else
      puts n
    end
