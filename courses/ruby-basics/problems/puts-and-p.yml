id: puts-and-p
title: puts and p
type: multiple_choice
body: |
  Ruby has two everyday ways of printing a value. puts prints it for people
  to read. p prints it as Ruby would write it in a program, which is handier
  when you want to see exactly what a value is:

    puts 42        # prints 42
    p 42           # prints 42
    puts nil       # prints an empty line
    p nil          # prints nil
question: What does p "hi" print?
choices:
  - id: a
    text: hi
  - id: b
    text: '"hi"'
    correct: true
  - id: c
    text: ":hi"
  - id: d
    text: nothing
explanation: |
  p shows a String with its quotes, so you can tell "42" from 42 and see
  spaces at the ends of a string.
