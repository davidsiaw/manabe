id: marshal
title: Saving Objects with Marshal
type: multiple_choice
body: |
  Sometimes you want to save objects, to a file say, and get them back
  later, even in another run of the program. Turning objects into bytes
  and back is serialization, and Ruby calls it marshaling:

    class GameCharacter
      attr_reader :power, :type, :weapons

      def initialize(power, type, weapons)
        @power = power
        @type = type
        @weapons = weapons
      end
    end

    gc = GameCharacter.new(120, 'Magician', ['spells', 'invisibility'])
    File.open('game', 'w') do |f|
      Marshal.dump(gc, f)
    end

    # later, maybe in another program that defines GameCharacter too:
    File.open('game') do |f|
      gc = Marshal.load(f)
    end
    puts "#{gc.power} #{gc.type}"     # 120 Magician

  Marshal saves data: an object's class name and its instance variables,
  and the objects they refer to in turn. It cannot save code, such as a
  Proc, or things that belong to the operating system, such as an open
  file, and raises an error if asked to.

  Marshal is not in the mruby in this browser.
question: Which of these could Marshal.dump save?
choices:
  - id: a
    text: A hash of arrays of strings and numbers
    correct: true
  - id: b
    text: An open File
  - id: c
    text: A lambda
  - id: d
    text: An object with an instance variable holding a Proc
explanation: |
  Plain data can be saved. Procs and open files cannot, even when they are
  inside other objects.
