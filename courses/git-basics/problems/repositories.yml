id: repositories
title: Repositories
type: multiple_choice
body: |
  Git records the history of a folder of files. A folder whose history Git
  keeps is a repository, and the history itself lives in a hidden `.git`
  folder inside it.

  `git init` turns the current folder into a new, empty repository.
  `git clone <url>` copies an existing repository, including its whole
  history, from somewhere else.

  Because every clone has the full history, most Git commands work without a
  network connection.
question: Where does Git keep the history of a repository?
choices:
  - id: a
    text: On a central server, always
  - id: b
    text: In the hidden .git folder inside the repository
    correct: true
  - id: c
    text: In a file called history.txt
  - id: d
    text: In your home directory
explanation: |
  The .git folder holds the history. Delete it and the folder is just a
  folder again.
