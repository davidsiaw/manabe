id: closure-types
title: Closure Types
type: multiple_choice
body: |
  Closures rarely need type annotations: they are short, used in one place,
  and Rust infers their parameters and result from how they are used.
  Annotations are allowed, and look much like a function's:

    fn  add_one_v1   (x: u32) -> u32 { x + 1 }
    let add_one_v2 = |x: u32| -> u32 { x + 1 };
    let add_one_v3 = |x|             { x + 1 };
    let add_one_v4 = |x|               x + 1  ;

  But each closure gets one concrete type for each parameter, from its
  first use:

    let example_closure = |x| x;
    let s = example_closure(String::from("hello"));
    let n = example_closure(5);
question: What does the last line do?
choices:
  - id: a
    text: "It does not compile: x was inferred to be a String"
    correct: true
  - id: b
    text: It returns 5
  - id: c
    text: It returns "5"
  - id: d
    text: It panics
explanation: |
  The error is "mismatched types: expected `String`, found integer". A
  closure is not generic: its types are fixed by the first call.
