id: statements-expressions
title: Statements and Expressions
type: multiple_choice
body: |
  Rust tells apart two kinds of code:

  - A statement does something and has no value. let y = 6; is a statement,
    and so is a function definition. Because it has no value, a statement
    cannot be assigned: let x = (let y = 6); does not compile.
  - An expression produces a value. 5 + 6 is an expression, and so are a
    function call, a macro call, and a block in curly brackets.

  A block's value is the value of its last expression. That last line has
  no semicolon: adding one turns it into a statement, and the block's
  value becomes () instead.

    let y = {
        let x = 3;
        x + 1
    };
question: What is the value of y in the code above?
choices:
  - id: a
    text: '3'
  - id: b
    text: '4'
    correct: true
  - id: c
    text: '()'
  - id: d
    text: It does not compile, as x is not visible outside the block
explanation: |
  The block's last line, x + 1, has no semicolon, so it is the block's value:
  4. x only exists inside the block, but its value has already been used.
