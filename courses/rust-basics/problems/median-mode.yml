id: median-mode
title: "Putting It Together: Median and Mode"
type: code
language: rust
run: local
body: |
  The first exercise from the end of the chapter: for a list of integers,
  find the median, the value in the middle position once the list is
  sorted, and the mode, the value that occurs most often.

  A vector can be sorted in place with sort(), once it is mut; to sort a
  copy, clone it first with to_vec(). For the mode, count each value in a
  hash map, then find the value with the highest count.

  Copy the program into src/main.rs in your hello project and run it; it panics at todo!().
question: Write median and mode. Run it and paste what it printed.
starter_code: |
  use std::collections::HashMap;

  fn median(numbers: &[i32]) -> i32 {
      todo!()
  }

  fn mode(numbers: &[i32]) -> i32 {
      todo!()
  }

  fn main() {
      let numbers = vec![7, 3, 9, 3, 5, 1, 3, 8, 6];
      println!("median {}, mode {}", median(&numbers), mode(&numbers));
      println!("still in order: {numbers:?}");
  }
expected_output: |
  median 5, mode 3
  still in order: [7, 3, 9, 3, 5, 1, 3, 8, 6]
explanation: |
  median sorts a copy, so that main's vector keeps its order, and takes the
  element at len / 2. mode counts with entry, then keeps the value with the
  highest count. for &n in numbers takes each i32 out of its reference.
  With an even number of values, or two values tied for the mode, you
  would have to decide what the answer should be.
