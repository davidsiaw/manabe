id: tuples
title: Tuples
type: multiple_choice
body: |
  A tuple groups a fixed number of values, which can be of different types,
  into one. Write the values in parentheses, separated by commas:

    let tup: (i32, f64, u8) = (500, 6.4, 1);

  To get the values out, either take it apart with a pattern, which is
  called destructuring:

    let (x, y, z) = tup;    // x is 500, y is 6.4, z is 1

  or use a full stop and the position, counting from 0:

    let five_hundred = tup.0;

  The empty tuple, (), is called the unit. It is the value of expressions
  that have no other value, and what functions return when they do not say
  otherwise.
question: |
  Given let tup = (500, 6.4, 1); what is tup.1 ?
choices:
  - id: a
    text: '500'
  - id: b
    text: '6.4'
    correct: true
  - id: c
    text: '1'
  - id: d
    text: It does not compile, as the values have different types
explanation: |
  Positions count from 0: tup.0 is 500, tup.1 is 6.4 and tup.2 is 1. The
  values of a tuple can have different types; those of an array cannot.
