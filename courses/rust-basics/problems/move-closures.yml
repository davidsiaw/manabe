id: move-closures
title: move Closures
type: code
language: rust
run: local
body: |
  move before a closure makes it take ownership of what it captures, even
  when the body would only need a reference.

  That is needed when the closure may outlive the variables it uses, as
  with a new thread: thread::spawn runs the closure in a thread that could
  go on running after main's variables are gone, so it cannot borrow them.

  Copy the program into src/main.rs in your hello project and run it:

    error[E0373]: closure may outlive the current function, but it borrows `list`, which is owned by the current function
question: Make the closure take ownership of list. Run it and paste what it printed.
starter_code: |
  use std::thread;

  fn main() {
      let list = vec![1, 2, 3];
      println!("Before defining closure: {list:?}");

      thread::spawn(|| println!("From thread: {list:?}"))
          .join()
          .unwrap();
  }
expected_output: |
  Before defining closure: [1, 2, 3]
  From thread: [1, 2, 3]
explanation: |
  move || .... The thread now owns list, and main can no longer use it.
  join waits for the thread; chapter 16 is about threads.
