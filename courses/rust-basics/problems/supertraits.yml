id: supertraits
title: Supertraits
type: code
language: rust
run: local
body: |
  A trait can require another: trait OutlinePrint: fmt::Display means a
  type can only implement OutlinePrint if it implements Display, and
  OutlinePrint's methods can use to_string and {} on self.

  Copy the program into src/main.rs in your hello project and run it:

    error[E0277]: `Point` doesn't implement `std::fmt::Display`
question: Implement Display for Point, as (x, y), so that it can be outlined. Run it and paste what it printed.
starter_code: |
  use std::fmt;

  trait OutlinePrint: fmt::Display {
      fn outline_print(&self) {
          let output = self.to_string();
          let len = output.len();
          println!("{}", "*".repeat(len + 4));
          println!("*{}*", " ".repeat(len + 2));
          println!("* {output} *");
          println!("*{}*", " ".repeat(len + 2));
          println!("{}", "*".repeat(len + 4));
      }
  }

  struct Point {
      x: i32,
      y: i32,
  }

  impl OutlinePrint for Point {}

  fn main() {
      Point { x: 1, y: 3 }.outline_print();
  }
expected_output: |
  **********
  *        *
  * (1, 3) *
  *        *
  **********
explanation: |
  impl fmt::Display for Point, writing ({}, {}). impl OutlinePrint for
  Point {} is empty: the default method is all it needs, now that Display
  is there.
