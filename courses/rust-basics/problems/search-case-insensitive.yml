id: search-case-insensitive
title: Case-Insensitive Search
type: code
language: rust
run: local
body: |
  The next feature, test first again: a search that ignores case, so that
  rUsT finds Rust. Replace src/lib.rs with the code below: it has both
  tests, and search_case_insensitive returns nothing yet.

  to_lowercase makes a lower-case copy of a string, a new String. Lower
  the query once, and each line as it is checked. contains takes a &str,
  so pass it &query.
question: Write search_case_insensitive. Run cargo test -- --test-threads=1 and paste everything it printed.
starter_code: |
  pub fn search<'a>(query: &str, contents: &'a str) -> Vec<&'a str> {
      let mut results = Vec::new();

      for line in contents.lines() {
          if line.contains(query) {
              results.push(line);
          }
      }

      results
  }

  pub fn search_case_insensitive<'a>(query: &str, contents: &'a str) -> Vec<&'a str> {
      vec![]
  }

  #[cfg(test)]
  mod tests {
      use super::*;

      #[test]
      fn case_sensitive() {
          let query = "duct";
          let contents = "\
  Rust:
  safe, fast, productive.
  Pick three.
  Duct tape.";

          assert_eq!(vec!["safe, fast, productive."], search(query, contents));
      }

      #[test]
      fn case_insensitive() {
          let query = "rUsT";
          let contents = "\
  Rust:
  safe, fast, productive.
  Pick three.
  Trust me.";

          assert_eq!(vec!["Rust:", "Trust me."], search_case_insensitive(query, contents));
      }
  }
expected_output: |
  running 2 tests
  test tests::case_insensitive ... ok
  test tests::case_sensitive ... ok

  test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out

  running 0 tests

  test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out

  running 0 tests

  test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out
explanation: |
  let query = query.to_lowercase(); then line.to_lowercase().contains(&query).
  The new query shadows the parameter, and is a String. The original line
  is pushed, not the lowered copy, so the results keep their case. The
  Duct tape line in case_sensitive checks that search did not start
  ignoring case too.
