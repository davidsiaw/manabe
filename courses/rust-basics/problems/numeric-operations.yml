id: numeric-operations
title: Floats and Arithmetic
type: multiple_choice
body: |
  Besides integers, Rust has two floating-point types, for numbers with a
  fractional part: f32 and f64, 32 and 64 bits wide. A literal with a
  decimal point is an f64 unless you say otherwise, as f64 is about as fast
  as f32 on modern computers and more precise.

    let x = 2.0;        // f64
    let y: f32 = 3.0;   // f32

  The arithmetic operators are + - * / and % (the remainder), and both sides
  must have the same type: Rust does not mix an integer and a float without
  a conversion.

  Dividing two integers gives an integer. The fractional part is dropped,
  rounding towards zero:

    let a = 7 / 2;      // 3
    let b = 7.0 / 2.0;  // 3.5
    let c = 7 % 2;      // 1
question: What is the value of -5 / 3, where both are i32?
choices:
  - id: a
    text: '-1'
    correct: true
  - id: b
    text: '-2'
  - id: c
    text: '-1.6666666666666667'
  - id: d
    text: It does not compile
explanation: |
  -5 / 3 is -1.67, and integer division drops the fraction, rounding
  towards zero: -1. It does not round down to -2.
