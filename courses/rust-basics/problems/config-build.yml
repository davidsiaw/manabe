id: config-build
title: Config::build
type: code
language: rust
run: local
body: |
  With fewer than two arguments, indexing args panics, with a message
  about index out of bounds that means nothing to a user. Config::build
  checks first, and returns an error instead:

    fn build(args: &[String]) -> Result<Config, &'static str>

  main then deals with the error: unwrap_or_else returns the value inside
  Ok, or, on Err, calls the closure it is given with the error. The
  closure prints a message and stops the program with process::exit(1):
  the exit code 1 tells whoever ran it that it failed.

  Copy the program into src/main.rs, keeping poem.txt, and run cargo run
  with no arguments: it panics.
question: Make build check that there are enough arguments, and return the error "not enough arguments" otherwise. Run cargo run with no arguments, and paste what it printed.
starter_code: |
  use std::env;
  use std::error::Error;
  use std::fs;
  use std::process;

  fn main() {
      let args: Vec<String> = env::args().collect();

      let config = Config::build(&args).unwrap_or_else(|err| {
          eprintln!("Problem parsing arguments: {err}");
          process::exit(1);
      });

      if let Err(e) = run(config) {
          eprintln!("Application error: {e}");
          process::exit(1);
      }
  }

  struct Config {
      query: String,
      file_path: String,
  }

  impl Config {
      fn build(args: &[String]) -> Result<Config, &'static str> {
          let query = args[1].clone();
          let file_path = args[2].clone();

          Ok(Config { query, file_path })
      }
  }

  fn run(config: Config) -> Result<(), Box<dyn Error>> {
      let contents = fs::read_to_string(config.file_path)?;

      println!("Searching for {}", config.query);
      println!("With text:\n{contents}");

      Ok(())
  }
expected_output: |
  Problem parsing arguments: not enough arguments
explanation: |
  if args.len() < 3 { return Err("not enough arguments"); } at the start
  of build. Cargo also says "process didn't exit successfully", because of
  the exit code 1; that line is Cargo's, and is left out when your answer
  is checked. main also handles run's errors: try cargo run -- the
  missing.txt.
