id: panic-backtrace
title: Backtraces
type: multiple_choice
body: |
  When the panic happens inside the standard library, the line it names is
  not in your code. A backtrace lists every function that was running when
  it happened, the function calls that led there. Set the environment
  variable RUST_BACKTRACE to see it:

    $ RUST_BACKTRACE=1 cargo run

  Read it from the top, until you reach files you wrote: the first of
  those is where your code went wrong. Lines above are the code your code
  called; lines below, the code that called yours.

  By default, a panic unwinds: Rust walks back up the stack, cleaning up
  each function's data. In Cargo.toml, panic = 'abort' in a profile makes
  it stop at once, leaving the cleanup to the operating system, for a
  smaller program.
question: A backtrace's top lines are in the standard library. Where is the bug most likely to be?
choices:
  - id: a
    text: In the first line from your own code, below them
    correct: true
  - id: b
    text: In the standard library, on the top line
  - id: c
    text: In main, at the very bottom
  - id: d
    text: Backtraces cannot tell you that
explanation: |
  The standard library did what it was asked; the question is what your
  code asked it to do. Debug builds, which cargo run makes by default,
  carry the information that backtraces need.
