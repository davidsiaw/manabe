id: search-iterator
title: "minigrep: search with Iterators"
type: code
language: rust
run: local
body: |
  search builds its result with a mutable vector and a loop. With
  iterator adapters it is a chain: the lines, filtered to those that
  contain the query, collected.

  Besides being shorter, the chain leaves no mutable state, and the filter
  could be run on several threads without changing much: the steps say
  what is wanted, not how to keep track of it.

  Replace src/lib.rs with the code below: search panics at todo!(), and the
  tests fail.
question: Write search as an iterator chain. Run cargo test -- --test-threads=1 and paste everything it printed.
starter_code: |
  pub fn search<'a>(query: &str, contents: &'a str) -> Vec<&'a str> {
      // Rewrite this with lines, filter and collect.
      todo!()
  }

  pub fn search_case_insensitive<'a>(query: &str, contents: &'a str) -> Vec<&'a str> {
      let query = query.to_lowercase();
      let mut results = Vec::new();

      for line in contents.lines() {
          if line.to_lowercase().contains(&query) {
              results.push(line);
          }
      }

      results
  }

  #[cfg(test)]
  mod tests {
      use super::*;

      #[test]
      fn case_sensitive() {
          let query = "duct";
          let contents = "\
  Rust:
  safe, fast, productive.
  Pick three.
  Duct tape.";

          assert_eq!(vec!["safe, fast, productive."], search(query, contents));
      }

      #[test]
      fn case_insensitive() {
          let query = "rUsT";
          let contents = "\
  Rust:
  safe, fast, productive.
  Pick three.
  Trust me.";

          assert_eq!(vec!["Rust:", "Trust me."], search_case_insensitive(query, contents));
      }
  }
expected_output: |
  running 2 tests
  test tests::case_insensitive ... ok
  test tests::case_sensitive ... ok

  test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out

  running 0 tests

  test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out

  running 0 tests

  test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out
explanation: |
  contents.lines().filter(|line| line.contains(query)).collect(). The
  collected type comes from the return type, Vec<&'a str>.
  search_case_insensitive can be rewritten the same way.
