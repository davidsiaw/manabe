id: extern-c
title: Calling C with extern
type: code
language: rust
run: local
body: |
  extern blocks declare functions from another language, almost always C,
  using the C ABI. They are unsafe to call, as Rust cannot check what they
  do: the block is marked unsafe, and each function inside can be marked
  safe if it is.

    unsafe extern "C" {
        safe fn abs(input: i32) -> i32;
        fn strlen(s: *const std::ffi::c_char) -> usize;
    }

  abs is safe for any input, so it can be called directly; strlen reads
  memory through a pointer, so calling it stays unsafe. Rust programs link
  the C standard library already, on most systems.

  Copy the program into src/main.rs in your hello project and run it:

    error[E0425]: cannot find function `abs` in this scope
question: Declare abs and strlen as above. Call strlen in an unsafe block, with c"hello".as_ptr(). Run it and paste what it printed.
starter_code: |
  fn main() {
      println!("Absolute value of -3 according to C: {}", abs(-3));
      let len = 0;
      println!("strlen of hello: {len}");
  }
expected_output: |
  Absolute value of -3 according to C: 3
  strlen of hello: 5
explanation: |
  c"hello" is a C string literal, a &CStr, which ends in a 0 byte as C
  expects; as_ptr gives the pointer. The other direction works too: #[unsafe(no_mangle)]
  pub extern "C" fn makes a Rust function callable from C.
