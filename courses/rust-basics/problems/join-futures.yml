id: join-futures
title: Running Futures Concurrently
type: code
language: rust
run: local
body: |
  Awaiting one future after another runs them one after another.
  trpl::join(a, b) runs two futures concurrently, and finishes when both
  have; while one waits, the other runs.

  trpl::sleep(duration).await pauses the current future without blocking
  the thread, unlike std::thread::sleep. In the program, a works in steps of
  100 milliseconds, and b in steps of 150.

  Copy the program into src/main.rs in your hello project and run it: it runs a to the end, and only then b.
question: Run a and b with trpl::join, so that their lines interleave as below. Run it and paste what it printed.
starter_code: |
  use std::time::Duration;

  fn main() {
      trpl::run(async {
          let a = async {
              for i in 1..=3 {
                  println!("a{i}");
                  trpl::sleep(Duration::from_millis(100)).await;
              }
          };
          let b = async {
              for i in 1..=3 {
                  println!("b{i}");
                  trpl::sleep(Duration::from_millis(150)).await;
              }
          };

          a.await;
          b.await;
      });
  }
expected_output: |
  a1
  b1
  a2
  b2
  a3
  b3
explanation: |
  trpl::join(a, b).await. a prints at 0, 100 and 200 milliseconds, and b at
  0, 150 and 300, so their lines alternate. Both run on one thread: this is
  concurrency, not parallelism. join_all does the same for a whole vector
  of futures.
