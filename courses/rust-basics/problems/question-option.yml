id: question-option
title: "? on Option"
type: code
language: rust
run: local
body: |
  ? works on Option the same way, in a function that returns an Option:
  Some gives the value, and None returns None from the function.

    fn last_char_of_first_line(text: &str) -> Option<char> {
        text.lines().next()?.chars().last()
    }

  lines().next() is None for an empty text; chars().last() is None for an
  empty line. ? stops at the first None. ? does not convert between the
  two: in a function that returns an Option, it only works on Options.

  Copy the program into src/main.rs in your hello project and run it; it panics at todo!().
question: Write first_word_length, which returns the length of the second line's first word, or None when there is no such line or word. Use ?. Run it and paste what it printed.
starter_code: |
  fn first_word_length(text: &str) -> Option<usize> {
      todo!()
  }

  fn main() {
      println!("{:?}", first_word_length("title\nhello world"));
      println!("{:?}", first_word_length("title only"));
      println!("{:?}", first_word_length("title\n   "));
  }
expected_output: |
  Some(5)
  None
  None
explanation: |
  text.lines().nth(1)? for the second line, split_whitespace().next()?
  for its first word, and Some(word.len()). In one line:
  Some(text.lines().nth(1)?.split_whitespace().next()?.len()).
