id: restaurant-modules
title: "Putting It Together: A Restaurant"
type: code
language: rust
run: local
body: |
  A restaurant in modules, with an order going through the front of house
  and the back of house. It needs most of this chapter: public modules and
  functions, a struct with a private field, super, and use.

  Copy the program into src/main.rs in your hello project and run it. The
  compiler reports 3 errors, and more turn up as you fix those: it checks
  privacy only once every path leads somewhere. Fix them, run it again and
  read the next ones, until it runs.
question: "Make it compile without changing what it does: add pub, super and use where they are needed. Run it and paste what it printed."
starter_code: |
  mod front_of_house {
      mod hosting {
          fn seat(guests: u32) {
              println!("seating {guests} guests");
          }
      }

      pub mod serving {
          pub fn take_order(dish: &str) -> back_of_house::Order {
              println!("ordering {dish}");
              back_of_house::Order::new(dish)
          }
      }
  }

  mod back_of_house {
      pub struct Order {
          dish: String,
          pub ready: bool,
      }

      impl Order {
          fn new(dish: &str) -> Order {
              Order { dish: String::from(dish), ready: false }
          }

          pub fn cook(&mut self) {
              println!("cooking {}", self.dish);
              self.ready = true;
          }
      }
  }

  fn main() {
      hosting::seat(2);
      let mut order = front_of_house::serving::take_order("soup");
      order.cook();
      if order.ready {
          println!("soup is served");
      }
  }
expected_output: |
  seating 2 guests
  ordering soup
  cooking soup
  soup is served
explanation: |
  - main uses hosting by its name alone: use front_of_house::hosting; in
    the crate root.
  - hosting and seat need pub.
  - serving refers to back_of_house, which is not in serving: use
    crate::back_of_house; inside serving, or write
    crate::back_of_house::Order, or super::super::back_of_house::Order.
  - Order::new needs pub, as serving calls it from outside back_of_house.

  dish stays private: only cook, inside the module, reads it.
