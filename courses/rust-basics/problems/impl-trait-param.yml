id: impl-trait-param
title: Traits as Parameters
type: code
language: rust
run: local
body: |
  A function can take any type that implements a trait, by writing impl
  and the trait in place of the parameter's type:

    pub fn notify(item: &impl Summary) {
        println!("Breaking news! {}", item.summarize());
    }

  Inside, the function can call any method of the trait on item, and
  nothing else: that is all it knows about it.

  Copy the program into src/main.rs in your hello project and run it:

    error[E0308]: mismatched types
question: Make notify take any Summary. Run it and paste what it printed.
starter_code: |
  pub trait Summary {
      fn summarize(&self) -> String;
  }

  pub struct NewsArticle {
      pub headline: String,
  }

  impl Summary for NewsArticle {
      fn summarize(&self) -> String {
          self.headline.clone()
      }
  }

  pub struct SocialPost {
      pub username: String,
      pub content: String,
  }

  impl Summary for SocialPost {
      fn summarize(&self) -> String {
          format!("{}: {}", self.username, self.content)
      }
  }

  pub fn notify(item: &NewsArticle) {
      println!("Breaking news! {}", item.summarize());
  }

  fn main() {
      let article = NewsArticle { headline: String::from("Penguins win!") };
      let post = SocialPost { username: String::from("penguin_fan"), content: String::from("we did it") };

      notify(&article);
      notify(&post);
  }
expected_output: |
  Breaking news! Penguins win!
  Breaking news! penguin_fan: we did it
explanation: |
  item: &impl Summary. Calling notify with a String would not compile:
  "the trait bound `String: Summary` is not satisfied".
