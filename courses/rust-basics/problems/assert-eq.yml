id: assert-eq
title: assert_eq! and assert_ne!
type: code
language: rust
run: local
body: |
  Checking that a value equals what it should is so common that there is a
  macro for it: assert_eq!(left, right). When they differ, it prints both,
  which assert!(a == b) cannot:

    assertion `left == right` failed
      left: 5
     right: 4

  assert_ne! checks that two values differ. Both need the values to
  implement PartialEq, to compare them, and Debug, to print them; for your
  own types, #[derive(PartialEq, Debug)] gives both.

  Replace src/lib.rs in your adder project with the code below, and run cargo test -- --test-threads=1.
question: Fix the bugs that the failures show. Run the tests and paste everything cargo test printed.
starter_code: |
  pub fn add_two(a: u64) -> u64 {
      a + 3
  }

  #[derive(PartialEq, Debug)]
  pub struct Point {
      pub x: i32,
      pub y: i32,
  }

  pub fn mirror(p: &Point) -> Point {
      Point { x: p.y, y: p.x }
  }

  #[cfg(test)]
  mod tests {
      use super::*;

      #[test]
      fn it_adds_two() {
          assert_eq!(add_two(2), 4);
      }

      #[test]
      fn mirror_flips_x() {
          assert_eq!(mirror(&Point { x: 3, y: 4 }), Point { x: -3, y: 4 });
      }

      #[test]
      fn mirror_changes_the_point() {
          let p = Point { x: 3, y: 4 };
          assert_ne!(mirror(&p), p);
      }
  }
expected_output: |
  running 3 tests
  test tests::it_adds_two ... ok
  test tests::mirror_changes_the_point ... ok
  test tests::mirror_flips_x ... ok

  test result: ok. 3 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out

  running 0 tests

  test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out
explanation: |
  a + 2, and Point { x: -p.x, y: p.y }. The failures showed left and right
  for each: "left: 5, right: 4", and two different Points. Rust calls them
  left and right rather than expected and actual, so the order does not
  matter.
