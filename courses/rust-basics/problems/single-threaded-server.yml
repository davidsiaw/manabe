id: single-threaded-server
title: A Single-Threaded Server
type: code
language: rust
run: local
body: |
  std::net::TcpListener::bind listens on an address and port, and incoming
  gives each connection, as a TcpStream, which reads like a file and writes
  like one. BufReader::new(&stream).lines() reads the request a line at a
  time, and the request's headers end at the first empty line.

  The server below handles two connections, take(2), and stops, so that
  you can see it end. It answers 200 to everything.

  Make a project for the server, cargo new hello_server. Its code goes in
  src/main.rs, and, from the thread pool on, src/lib.rs.

  Put the program in src/main.rs, run it with cargo run, and in a second
  terminal request two pages:

    curl http://127.0.0.1:7878/
    curl http://127.0.0.1:7878/missing

  (Or open them in a web browser, one after the other.)
question: Answer 404 NOT FOUND, with the body <h1>Oops!</h1>, for anything but GET / HTTP/1.1. Run it again, make the same two requests, and paste what the server printed.
starter_code: |
  use std::{
      io::{BufReader, prelude::*},
      net::{TcpListener, TcpStream},
  };

  fn main() {
      let listener = TcpListener::bind("127.0.0.1:7878").unwrap();
      println!("listening on http://127.0.0.1:7878");

      for stream in listener.incoming().take(2) {
          handle_connection(stream.unwrap());
      }
      println!("shutting down");
  }

  fn handle_connection(mut stream: TcpStream) {
      let buf_reader = BufReader::new(&stream);
      let request: Vec<String> = buf_reader
          .lines()
          .map(|line| line.unwrap())
          .take_while(|line| !line.is_empty())
          .collect();
      let request_line = &request[0];

      let (status_line, contents) = ("HTTP/1.1 200 OK", "<h1>Hello!</h1>");

      let length = contents.len();
      let response = format!("{status_line}\r\nContent-Length: {length}\r\n\r\n{contents}");

      println!("{request_line} -> {status_line}");
      stream.write_all(response.as_bytes()).unwrap();
  }
expected_output: |
  listening on http://127.0.0.1:7878
  GET / HTTP/1.1 -> HTTP/1.1 200 OK
  GET /missing HTTP/1.1 -> HTTP/1.1 404 NOT FOUND
  shutting down
explanation: |
  An if on the request line, choosing the status line and the body. The
  book reads the bodies from hello.html and 404.html with
  fs::read_to_string; inline text keeps it to one file. Content-Length
  tells the client how much body to read.
