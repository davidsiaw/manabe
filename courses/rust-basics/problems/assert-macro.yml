id: assert-macro
title: assert!
type: code
language: rust
run: local
body: |
  assert!(condition) panics when the condition is false, and is the check
  to use for anything that gives a bool. Here is the Rectangle of chapter
  5, with its can_hold method, and two tests: a larger rectangle can hold
  a smaller one, and a smaller one cannot hold a larger one.

  Replace src/lib.rs in your adder project with the code below, and run cargo test -- --test-threads=1. One test FAILED: read why, after the results.
question: Fix can_hold, so that both tests pass. Run the tests and paste everything cargo test printed.
starter_code: |
  #[derive(Debug)]
  pub struct Rectangle {
      pub width: u32,
      pub height: u32,
  }

  impl Rectangle {
      pub fn can_hold(&self, other: &Rectangle) -> bool {
          self.width < other.width && self.height > other.height
      }
  }

  #[cfg(test)]
  mod tests {
      use super::*;

      #[test]
      fn larger_can_hold_smaller() {
          let larger = Rectangle { width: 8, height: 7 };
          let smaller = Rectangle { width: 5, height: 1 };

          assert!(larger.can_hold(&smaller));
      }

      #[test]
      fn smaller_cannot_hold_larger() {
          let larger = Rectangle { width: 8, height: 7 };
          let smaller = Rectangle { width: 5, height: 1 };

          assert!(!smaller.can_hold(&larger));
      }
  }
expected_output: |
  running 2 tests
  test tests::larger_can_hold_smaller ... ok
  test tests::smaller_cannot_hold_larger ... ok

  test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out

  running 0 tests

  test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out
explanation: |
  self.width > other.width. The failure said "assertion failed:
  larger.can_hold(&smaller)". Testing both directions caught it: the
  second test passed even with the bug, as a smaller rectangle "cannot
  hold" the larger one either way.
