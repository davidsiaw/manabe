id: pub-use
title: Re-exporting with pub use
type: multiple_choice
body: |
  A name brought in with use is private to its scope: code outside cannot
  use the shortcut. pub use makes it public, so that others can use it as
  if the item were defined there. This is re-exporting.

    mod front_of_house {
        pub mod hosting {
            pub fn add_to_waitlist() {}
        }
    }

    pub use crate::front_of_house::hosting;

  It lets a library be organised one way inside, and offer a simpler
  structure to the people using it. Customers think in terms of hosting,
  not of front and back of house.
question: With that pub use in the restaurant library's crate root, how can another crate call add_to_waitlist?
choices:
  - id: a
    text: restaurant::hosting::add_to_waitlist()
    correct: true
  - id: b
    text: Only restaurant::front_of_house::hosting::add_to_waitlist()
  - id: c
    text: hosting::add_to_waitlist(), without the crate's name
  - id: d
    text: "It cannot: front_of_house is private"
explanation: |
  pub use made hosting a public name in the crate root. The long path does
  not work from outside at all, since front_of_house is not pub; the
  re-export is the only way in.
