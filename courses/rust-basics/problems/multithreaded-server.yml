id: multithreaded-server
title: "Putting It Together: The Multithreaded Server"
type: code
language: rust
run: local
body: |
  The last step: the server hands each connection to the thread pool,
  instead of handling it itself.

    let pool = ThreadPool::new(4);
    for stream in listener.incoming() {
        let stream = stream.unwrap();
        pool.execute(|| handle_connection(stream));
    }

  Keep src/lib.rs with the finished pool, Drop included. The server below
  is single-threaded, with the book's /sleep route, which takes a second
  to answer. Run it, and request /sleep and then, straight away, /:

    curl http://127.0.0.1:7878/sleep & curl http://127.0.0.1:7878/

  (In PowerShell, or with a browser, open /sleep, and / within a second.)
  The server logs /sleep first: / had to wait for it. After its two
  connections, the server should drop the pool, which waits for the
  requests in progress, and only then say it is shutting down.
question: Make the server use a ThreadPool of 4 threads, and drop it before printing shutting down. Run it, make the same two requests, and paste what the server printed.
starter_code: |
  use std::{
      io::{BufReader, prelude::*},
      net::{TcpListener, TcpStream},
      thread,
      time::Duration,
  };

  fn main() {
      let listener = TcpListener::bind("127.0.0.1:7878").unwrap();
      println!("listening on http://127.0.0.1:7878");

      for stream in listener.incoming().take(2) {
          handle_connection(stream.unwrap());
      }
      println!("shutting down");
  }

  fn handle_connection(mut stream: TcpStream) {
      let buf_reader = BufReader::new(&stream);
      let request: Vec<String> = buf_reader
          .lines()
          .map(|line| line.unwrap())
          .take_while(|line| !line.is_empty())
          .collect();
      let request_line = &request[0];

      let (status_line, contents) = match &request_line[..] {
          "GET / HTTP/1.1" => ("HTTP/1.1 200 OK", "<h1>Hello!</h1>"),
          "GET /sleep HTTP/1.1" => {
              thread::sleep(Duration::from_secs(1));
              ("HTTP/1.1 200 OK", "<h1>Hello!</h1>")
          }
          _ => ("HTTP/1.1 404 NOT FOUND", "<h1>Oops!</h1>"),
      };

      let length = contents.len();
      let response = format!("{status_line}\r\nContent-Length: {length}\r\n\r\n{contents}");

      println!("{request_line} -> {status_line}");
      stream.write_all(response.as_bytes()).unwrap();
  }
expected_output: |
  listening on http://127.0.0.1:7878
  GET / HTTP/1.1 -> HTTP/1.1 200 OK
  GET /sleep HTTP/1.1 -> HTTP/1.1 200 OK
  shutting down
explanation: |
  use hello_server::ThreadPool;, a pool, pool.execute(|| handle_connection(stream)),
  and drop(pool) before the last println!. Now / is answered by another
  worker while /sleep is still sleeping, so it is logged first. Without the
  drop, main could print shutting down, and end, before /sleep was done.
