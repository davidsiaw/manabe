id: idiomatic-use
title: Idiomatic use Paths
type: multiple_choice
body: |
  use can bring in the function itself:

    use crate::front_of_house::hosting::add_to_waitlist;
    add_to_waitlist();

  But the usual way is to bring in the function's parent module, and call
  the function through it: hosting::add_to_waitlist(). That way it is clear
  that the function is not defined locally, and the path is still short.

  For structs, enums and other types, it is the opposite: bring in the
  type itself.

    use std::collections::HashMap;
    let mut map = HashMap::new();

  There is no deep reason; it is the convention, and people are used to
  reading code written that way. The exception is two types with the same
  name, which have to be told apart by their modules, such as fmt::Result
  and io::Result.
question: Which follows the convention?
choices:
  - id: a
    text: use std::collections::HashMap; then HashMap::new()
    correct: true
  - id: b
    text: use std::collections; then collections::HashMap::new()
  - id: c
    text: use crate::front_of_house::hosting::add_to_waitlist; then add_to_waitlist()
  - id: d
    text: Writing every path out in full, without use
explanation: |
  Types come in by their own name. Functions come in by their module, so
  hosting::add_to_waitlist() and not add_to_waitlist().
