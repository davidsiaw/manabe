id: macros-vs-functions
title: Macros
type: multiple_choice
body: |
  Macros are code that writes code: they run while compiling, and expand
  into other code. println! and vec! are macros. They can do what functions
  cannot:

  - take any number of arguments, of any types: println!("{} {}", a, b)
  - generate items, such as trait implementations, as #[derive(Debug)]
    does

  The cost is that macro definitions are harder to read and write than
  functions, and a macro must be defined, or brought into scope, before it
  is used in a file.

  Rust has declarative macros, written with macro_rules!, which match
  patterns of code, and procedural macros, written as functions that take
  code and return code: custom derive, attribute-like and function-like.
question: Which of these needs a macro rather than a function?
choices:
  - id: a
    text: Implementing a trait for every struct it is placed on
    correct: true
  - id: b
    text: Adding two numbers
  - id: c
    text: Returning the longer of two strings
  - id: d
    text: Sorting a vector
explanation: |
  #[derive(Debug)] is a procedural macro: it reads the struct's definition
  and writes the impl. Procedural macros live in a crate of their own, of
  the proc-macro type.
