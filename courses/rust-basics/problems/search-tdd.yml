id: search-tdd
title: Test-Driven Development
type: code
language: rust
run: local
body: |
  Now the search, in src/lib.rs, written test first, as test-driven
  development does it:

  1. Write a test that fails, and run it, to see that it fails as you
     expect.
  2. Write or change only enough code to make it pass.
  3. Tidy up the code, checking that the test still passes.
  4. Repeat.

  The test is written, and search returns nothing, so it fails. search
  takes the query and the text, and returns the lines that contain the
  query. The lines borrow from contents, which is what 'a says: the
  result lives as long as contents, and has nothing to do with query.

  Put the code in src/lib.rs; the package then has a library crate, also
  called minigrep, next to the program. Run cargo test --
  --test-threads=1.
question: "Make search pass the test: go through contents.lines(), and collect each line that contains the query. Run the tests and paste everything cargo test printed."
starter_code: |
  pub fn search<'a>(query: &str, contents: &'a str) -> Vec<&'a str> {
      vec![]
  }

  #[cfg(test)]
  mod tests {
      use super::*;

      #[test]
      fn one_result() {
          let query = "duct";
          let contents = "\
  Rust:
  safe, fast, productive.
  Pick three.";

          assert_eq!(vec!["safe, fast, productive."], search(query, contents));
      }
  }
expected_output: |
  running 1 test
  test tests::one_result ... ok

  test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out

  running 0 tests

  test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out

  running 0 tests

  test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out
explanation: |
  A for loop over contents.lines(), with an if on line.contains(query)
  pushing the line. There are three test sections now: the library's
  tests, the program's (none), and the documentation tests (none).
  Chapter 13 shortens search with iterator adaptors.
