x-app: &app
  image: davidsiaw/manabe:latest
  restart: unless-stopped
  environment: &app-env
    RAILS_ENV: production
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}
    DATABASE_URL: postgres://manabase:${POSTGRES_PASSWORD:?}@db:5432/manabase_production
    REDIS_URL: redis://redis:6379/0
    FRONTEND_HOSTS: ${FRONTEND_HOSTS:?}
    WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-${FRONTEND_HOSTS}}
    WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  networks:
    - manabase
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: manabase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - manabase-db:/var/lib/postgresql/data
    networks:
      - manabase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manabase -d manabase"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - manabase
  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *app-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    command: bin/rails db:prepare
  api:
    <<: *app
    environment:
      <<: *app-env
      VIRTUAL_HOST: ${API_HOST:?}
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: ${API_HOST:?}
    command: sh -c "rm -f tmp/pids/server.pid && exec bin/rails server -u falcon -b 0.0.0.0 -p 3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  sidekiq:
    <<: *app
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  manabase-db:
    external: true

networks:
  manabase:
    external: true
